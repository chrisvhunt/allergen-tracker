<style>
:root{
  /* Direction: precision instrument. Literata semibold for the human moments (titles, big numbers), Atkinson Hyperlegible for reading, its mono cut for data, hairlines instead of shadows, ink buttons, one brass accent. */
  --bg:#F5F5F2;
  --surface:#FFFFFF;
  --surface-2:#EFEFEB;
  --ink:#0E0F11;
  --muted:#686B72;
  --faint:#A2A4AA;
  --line:rgba(14,15,17,.08);
  --line-2:rgba(14,15,17,.16);
  --accent:#8A6A3C;
  --accent-soft:rgba(138,106,60,.10);
  --btn:#0E0F11; --btn-ink:#F7F6F2;
  --danger:#B3261E; --danger-soft:rgba(179,38,30,.07);
  --warn:#9C5A0C; --warn-soft:rgba(176,108,20,.09);
  --ok:#2E7452; --ok-soft:rgba(46,116,82,.08);
  --sev1:#B08A2E; --sev2:#C26628; --sev3:#B3261E; --sev4:#6A0F22;
  --shadow:0 1px 0 rgba(14,15,17,.02),0 12px 32px -18px rgba(14,15,17,.18);
  --display:"Literata","Iowan Old Style",Georgia,serif;
  --body:"Atkinson Hyperlegible Next",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --tabbar:rgba(245,245,242,.78);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09090A; --surface:#131315; --surface-2:#1B1B1E; --ink:#F2F1EC; --muted:#9A9CA2; --faint:#5E6066;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.15);
    --accent:#CBA874; --accent-soft:rgba(203,168,116,.12);
    --btn:#F2F1EC; --btn-ink:#0B0B0C;
    --danger:#FF6A5C; --danger-soft:rgba(255,106,92,.10); --warn:#E5A24A; --warn-soft:rgba(229,162,74,.10); --ok:#62C292; --ok-soft:rgba(98,194,146,.10);
    --sev1:#D8B24E; --sev2:#E98A4B; --sev3:#FF6A5C; --sev4:#E2507E;
    --shadow:0 0 0 1px rgba(255,255,255,.02),0 16px 40px -20px rgba(0,0,0,.8);
    --tabbar:rgba(9,9,10,.76);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09090A; --surface:#131315; --surface-2:#1B1B1E; --ink:#F2F1EC; --muted:#9A9CA2; --faint:#5E6066;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.15);
  --accent:#CBA874; --accent-soft:rgba(203,168,116,.12);
  --btn:#F2F1EC; --btn-ink:#0B0B0C;
  --danger:#FF6A5C; --danger-soft:rgba(255,106,92,.10); --warn:#E5A24A; --warn-soft:rgba(229,162,74,.10); --ok:#62C292; --ok-soft:rgba(98,194,146,.10);
  --sev1:#D8B24E; --sev2:#E98A4B; --sev3:#FF6A5C; --sev4:#E2507E;
  --shadow:0 0 0 1px rgba(255,255,255,.02),0 16px 40px -20px rgba(0,0,0,.8);
  --tabbar:rgba(9,9,10,.76);
  color-scheme:dark;
}
/* In-app appearance choice: overrides the host theme and the system setting. */
:root[data-appearance="light"]{
  --bg:#F5F5F2;
  --surface:#FFFFFF;
  --surface-2:#EFEFEB;
  --ink:#0E0F11;
  --muted:#686B72;
  --faint:#A2A4AA;
  --line:rgba(14,15,17,.08);
  --line-2:rgba(14,15,17,.16);
  --accent:#8A6A3C;
  --accent-soft:rgba(138,106,60,.10);
  --btn:#0E0F11; --btn-ink:#F7F6F2;
  --danger:#B3261E; --danger-soft:rgba(179,38,30,.07);
  --warn:#9C5A0C; --warn-soft:rgba(176,108,20,.09);
  --ok:#2E7452; --ok-soft:rgba(46,116,82,.08);
  --sev1:#B08A2E; --sev2:#C26628; --sev3:#B3261E; --sev4:#6A0F22;
  --shadow:0 1px 0 rgba(14,15,17,.02),0 12px 32px -18px rgba(14,15,17,.18);
  --tabbar:rgba(245,245,242,.78);
  color-scheme:light;
}
:root[data-appearance="dark"]{
  --bg:#09090A; --surface:#131315; --surface-2:#1B1B1E; --ink:#F2F1EC; --muted:#9A9CA2; --faint:#5E6066;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.15);
  --accent:#CBA874; --accent-soft:rgba(203,168,116,.12);
  --btn:#F2F1EC; --btn-ink:#0B0B0C;
  --danger:#FF6A5C; --danger-soft:rgba(255,106,92,.10); --warn:#E5A24A; --warn-soft:rgba(229,162,74,.10); --ok:#62C292; --ok-soft:rgba(98,194,146,.10);
  --sev1:#D8B24E; --sev2:#E98A4B; --sev3:#FF6A5C; --sev4:#E2507E;
  --shadow:0 0 0 1px rgba(255,255,255,.02),0 16px 40px -20px rgba(0,0,0,.8);
  --tabbar:rgba(9,9,10,.76);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 112px)}
.eyebrow{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
h1.title{font-family:var(--display);font-weight:650;font-size:42px;line-height:1.05;margin:10px 0 24px;letter-spacing:-.02em;text-wrap:balance;font-optical-sizing:auto}
h2.sec{font-family:var(--body);font-size:13.5px;font-weight:700;color:color-mix(in srgb,var(--ink) 72%,var(--bg));text-transform:uppercase;letter-spacing:.04em;margin:34px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line);order:1}
h2.sec button{order:2;font-family:var(--body);font-size:14px;text-transform:none;letter-spacing:-.005em;color:var(--accent);font-weight:500}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.pad{padding:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);letter-spacing:0}
.ico{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px;stroke-width:1.7}
.ico.lg{width:28px;height:28px}

/* sample banner */
.banner{display:flex;gap:12px;align-items:center;border:1px dashed var(--line-2);color:var(--ink);border-radius:var(--r-md);padding:12px 12px 12px 16px;margin-bottom:18px;font-size:14px;background:transparent}
.banner .ico{display:none}
.banner b{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.banner div{color:var(--muted);line-height:1.35}
.banner .btn{margin-left:auto;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:500;font-size:15px;transition:transform .15s ease,opacity .15s,background .2s}
.btn:active{transform:scale(.97);opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
.btn.block{width:100%;height:54px;font-size:16px;border-radius:16px}
.linkbtn{color:var(--accent);font-weight:500}

/* hero */
.hero{padding:22px 22px 18px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .big{font-family:var(--display);font-weight:600;font-size:88px;line-height:.9;letter-spacing:-.03em;margin:14px 0 4px;display:flex;align-items:baseline;gap:12px;font-variant-numeric:lining-nums}
.hero .big .unit{font-family:var(--display);font-style:italic;font-weight:500;font-size:26px;letter-spacing:-.01em;color:var(--muted)}
.hero .lede{font-size:14px;color:var(--muted);margin:2px 0 18px}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;align-items:end;height:30px}
.strip i{display:block;height:4px;border-radius:2px;background:var(--surface-2)}
.strip i.e{height:10px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.strip i.a{height:14px;background:var(--warn)}
.strip i.r{height:30px;background:var(--danger)}
.strip i.today{outline:1px solid var(--ink);outline-offset:1px}
.strip-legend{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:var(--body);font-size:12px;color:var(--faint);letter-spacing:.04em;gap:10px}
.strip-legend{flex-wrap:wrap}
.strip-legend>span{white-space:nowrap}
.strip-legend .keys{display:flex;gap:14px;order:3;width:100%;margin-top:4px}
.strip-legend .keys span{display:inline-flex;align-items:center;gap:5px}
.strip-legend .keys i{width:7px;height:7px;border-radius:2px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stats div{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-family:var(--display);font-size:28px;line-height:1;font-weight:650;font-variant-numeric:lining-nums tabular-nums}
.stats span{font-family:var(--body);font-size:13px;color:var(--muted);line-height:1.3}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:18px;text-align:left;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s,border-color .2s}
.qbtn:active{transform:scale(.98);border-color:var(--line-2)}
.qbtn .badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--ink)}
.qbtn.rx .badge{border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.qbtn b{font-size:16px;font-weight:500;letter-spacing:-.01em}
.qbtn span{font-size:13px;color:var(--muted);line-height:1.35}

/* list rows */
.list{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;width:100%;text-align:left;position:relative;transition:background .15s}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row .tm{width:54px;flex:none;font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:9px;letter-spacing:0}
.row .ic{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--muted)}
.row .ic.rx{border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);background:var(--danger-soft)}
.row .ic.hit{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn)}
.row .ic.hit3{border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:2px}
.row .main b{font-weight:500;font-size:16px;letter-spacing:-.01em;overflow-wrap:anywhere}
.row .main .sub{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .main .chips{margin-top:3px}
.row .chev{color:var(--faint);padding-top:9px}
.dayhead{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);margin:28px 2px 10px;text-transform:uppercase;letter-spacing:.05em}
.empty{padding:32px 24px;text-align:center;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .ico{width:30px;height:30px;color:var(--faint);margin-bottom:4px}

/* chips & pills */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted);line-height:1.35}
.chip.s1{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sev1) 45%,transparent);color:var(--sev1)}
.chip.s2{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sev2) 45%,transparent);color:var(--sev2)}
.chip.s3{box-shadow:none;background:var(--sev3);color:#fff}
.chip.s4{box-shadow:none;background:var(--sev4);color:#fff}
.chip.acc{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.chip.ok{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.tog{font-size:14px;font-weight:450;padding:9px 14px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);transition:all .15s}
.tog.on{background:var(--btn);color:var(--btn-ink);box-shadow:none}
.tog.dangerous.on{background:var(--danger);color:#fff}
.dot{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 6px;transition:all .15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg.types button{flex-direction:column;gap:5px;font-size:12.5px;min-height:62px}
.seg.sev button.on[data-v="1"]{color:var(--sev1)} .seg.sev button.on[data-v="2"]{color:var(--sev2)}
.seg.sev button.on[data-v="3"]{color:var(--sev3)} .seg.sev button.on[data-v="4"]{color:var(--sev4)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tabbar);backdrop-filter:saturate(160%) blur(24px);-webkit-backdrop-filter:saturate(160%) blur(24px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:64px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--faint);height:100%;justify-content:center;position:relative;transition:color .2s}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;top:6px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.fab{justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab .ico{width:22px;height:22px;stroke-width:1.8}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,6,8,.38);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top) - 20px);background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column;box-shadow:0 -1px 0 var(--line),0 -20px 60px rgba(0,0,0,.2)}
.sheet:not(.open){visibility:hidden;transition:transform .38s cubic-bezier(.2,.85,.25,1),visibility 0s linear .38s}
.sheet.open{transform:none}
.grab{padding:9px 0 3px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line-2)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 0 14px;margin-bottom:8px;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-align:center;color:var(--muted)}
.sh-head .l{justify-self:start;color:var(--muted);font-size:16px}
.sh-head .r{justify-self:end;color:var(--ink);font-size:16px;font-weight:600}
.sh-title{font-family:var(--display);font-size:32px;line-height:1.1;margin:6px 0 8px;font-weight:650;letter-spacing:-.02em;text-wrap:balance}

/* forms */
.form{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.field{display:flex;flex-direction:column;gap:8px}
.field>span,.flabel{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-left:2px}
input[type=text],input:not([type]),input[type=datetime-local],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);padding:13px 15px;width:100%;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 8%,transparent)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input[type=datetime-local]{min-height:50px;font-family:var(--mono);font-size:15px}
textarea{resize:vertical;min-height:50px;line-height:1.45}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.group{display:flex;flex-direction:column;gap:8px}
.group .gl{font-size:12.5px;font-weight:500;color:var(--faint);padding-left:2px}

/* alerts */
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line-2);align-items:flex-start;position:relative}
.alert .ico{margin-top:1px}
.alert b{display:block;font-size:15px;font-weight:600;margin-bottom:3px;letter-spacing:-.01em}
.alert p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.alert.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 35%,transparent);color:var(--danger)}
.alert.danger::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--danger)}
.alert.danger p{color:color-mix(in srgb,var(--danger) 70%,var(--ink))}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.alert.warn p{color:color-mix(in srgb,var(--warn) 60%,var(--ink))}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.alert.ok p{color:color-mix(in srgb,var(--ok) 55%,var(--ink))}
.alert.sos{background:var(--sev4);color:#fff;border:0}
.alert.sos p{color:rgba(255,255,255,.88)}
.alerts{display:flex;flex-direction:column;gap:8px}
.pulse{animation:pulse .45s ease}
@keyframes pulse{0%{transform:translateY(4px);opacity:.4}100%{transform:none;opacity:1}}

/* RCA */
.rca-top{padding:22px 20px 14px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:650;font-size:28px;font-variant-numeric:lining-nums;letter-spacing:-.02em}
.ring .v small{font-family:var(--mono);color:var(--muted);margin-left:1px}
.rca-top .k{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rca-top .n{font-family:var(--display);font-weight:650;font-size:30px;line-height:1.1;margin:6px 0 10px;letter-spacing:-.02em}
.ev{list-style:none;margin:0;padding:4px 20px 18px;display:flex;flex-direction:column;gap:9px;font-size:14px}
.ev li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.ev li .ico{margin-top:2px;color:var(--faint)}
.ev li.pos .ico{color:var(--danger)}
.ev li.neg .ico{color:var(--ok)}
.cand{border-top:1px solid var(--line)}
.cand summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 20px;cursor:pointer}
.cand summary::-webkit-details-marker{display:none}
.cand summary b{font-weight:500}
.cand summary .pct{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--ink)}
.bar.d i{background:var(--danger)}
.bar.w i{background:var(--warn)}
.kind{font-family:var(--body);font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-left:8px}
.cand .ev{padding:0 20px 14px}
.cand .acts{padding:0 20px 16px}
.confirmed{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--accent-soft);color:var(--accent);font-weight:500;font-size:14px;border-bottom:1px solid var(--line)}
.confirmed button{margin-left:auto;font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.foot{font-size:12.5px;color:var(--muted);padding:4px 4px;line-height:1.5}

/* insights */
.trig{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:15px 18px;align-items:center}
.trig+.trig{border-top:1px solid var(--line)}
.trig b{font-weight:500;font-size:16px}
.trig>.num{font-family:var(--display)!important;font-size:24px;font-weight:650!important;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.trig .meta{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.chart{padding:18px 14px 12px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--mono)}
.hbar{display:grid;grid-template-columns:120px 1fr 24px;gap:12px;align-items:center;padding:8px 18px;font-size:14px}
.hbar .t{height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--ink);border-radius:2px}
.hbar .c{text-align:right;color:var(--muted);font-family:var(--mono);font-size:12px}

/* allergens */
.alg{display:flex;gap:14px;align-items:center;padding:16px 18px;width:100%;text-align:left}
.alg+.alg{border-top:1px solid var(--line)}
.alg .sw{width:3px;align-self:stretch;border-radius:2px;flex:none}
.alg .main{flex:1;min-width:0}
.alg .main b{font-family:var(--display);font-size:20px;font-weight:650;display:block;letter-spacing:-.005em;line-height:1.2;margin-bottom:2px}
.alg .main span{font-size:13px;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{padding:12px 8px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line-2);font-size:14px;font-weight:450;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:58px;justify-content:center;transition:all .15s}
.preset:active{transform:scale(.97)}
.preset.added{border-color:var(--ink);background:var(--btn);color:var(--btn-ink)}
.settings .srow{display:flex;align-items:center;gap:14px;padding:15px 18px;width:100%;text-align:left}
.settings .srow+.srow{border-top:1px solid var(--line)}
.settings .srow .ico{color:var(--muted)}
.settings .srow.dz .ico,.settings .srow.dz{color:var(--danger)}
.settings .srow span{flex:1}
.settings .srow em{font-style:normal;color:var(--faint);font-family:var(--body);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);transform:translate(-50%,16px);opacity:0;z-index:60;background:var(--btn);color:var(--btn-ink);padding:11px 16px;border-radius:999px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;transition:all .3s cubic-bezier(.2,.85,.25,1);pointer-events:none;max-width:calc(100% - 40px);box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.danger{background:var(--danger);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;padding:16px 18px;font-size:15px;margin:0}
.kv dt{font-family:var(--body);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0;overflow-wrap:anywhere}
.tl{position:relative;padding:6px 18px 10px}
.tl::before{content:"";position:absolute;left:96px;top:18px;bottom:18px;width:1px;background:var(--line-2)}
.tl .it{display:grid;grid-template-columns:70px 1fr;gap:18px;padding:10px 0;font-size:14px;position:relative}
.tl .it::after{content:"";position:absolute;left:75px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1.5px var(--faint)}
.tl .it.r::after{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.tl .it .g{color:var(--muted);font-family:var(--mono);font-size:12px;padding-top:2px;text-align:right}
.tl .it.r b{color:var(--danger);font-weight:600}
pre.report{white-space:pre-wrap;font:12.5px/1.55 var(--mono);background:var(--surface);padding:16px;border-radius:var(--r-md);border:1px solid var(--line);margin:0;user-select:text;-webkit-user-select:text}
.search{position:relative}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:42px;background:var(--surface)}


/* launch screen */
.launch{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 70% at 50% 35%,#1E2126,#09090A);transition:opacity .5s ease .1s,visibility 0s linear .6s}
.launch.gone{opacity:0;visibility:hidden}
.launch .wm{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.01em;color:#F2F1EC;opacity:0;transform:translateY(6px);animation:rise .6s cubic-bezier(.2,.85,.25,1) .15s forwards}
.launch .tg{font-family:var(--body);font-size:16px;font-weight:500;line-height:1.4;letter-spacing:0;text-align:center;max-width:270px;text-wrap:balance;color:#CBA874;opacity:0;animation:rise .6s cubic-bezier(.2,.85,.25,1) .3s forwards}
.launch svg{animation:rise .6s cubic-bezier(.2,.85,.25,1) both}
/* install guide */
.install{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r-lg);border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow);margin-bottom:18px}
.install .hd{display:flex;gap:12px;align-items:center}
.install .hd img{width:44px;height:44px;border-radius:11px}
.install .hd b{font-family:var(--display);font-weight:650;font-size:19px;display:block}
.install .hd span{font-size:13.5px;color:var(--muted)}
.install ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.install li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4;counter-increment:st}
.install li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--btn-ink);font-size:12.5px;font-weight:700;margin-top:-1px}
.install .ico{vertical-align:-4px;color:var(--accent)}
/* entrance */
.enter>*{animation:rise .55s cubic-bezier(.2,.85,.25,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}
.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(6){animation-delay:.2s}.enter>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
"use strict";
/* ============================================================ knowledge base */
const DICT = [
  {id:"milk",name:"Milk",g:"food",kw:["dairy","butter","cheese","cream","whey","casein","caseinate","lactose","lactalbumin","ghee","yogurt","yoghurt","kefir","curd","custard","paneer","ricotta","mozzarella","parmesan","cheddar","feta","brie","ice cream","latte","cappuccino","alfredo","queso","buttermilk","creme fraiche","sour cream","milk chocolate","bechamel"],ex:["coconut milk","oat milk","almond milk","soy milk","rice milk","cashew milk","coconut cream","cocoa butter","peanut butter","almond butter","shea butter","cream of tartar"]},
  {id:"egg",name:"Egg",g:"food",kw:["eggs","albumin","albumen","mayonnaise","mayo","meringue","ovalbumin","lysozyme","aioli","hollandaise","custard","eggnog","frittata","omelet","omelette","quiche","brioche","carbonara","french toast","egg noodles"]},
  {id:"peanut",name:"Peanut",g:"food",kw:["peanuts","groundnut","arachis","satay","monkey nuts","peanut butter","peanut oil","peanut sauce","goober","pad thai","kung pao"]},
  {id:"treenut",name:"Tree nuts",g:"food",kw:["almond","almonds","cashew","walnut","pecan","pistachio","hazelnut","macadamia","brazil nut","pine nut","pine nuts","pesto","praline","marzipan","nutella","gianduja","frangipane","baklava","nougat","filbert","amaretto","mixed nuts","almond milk","cashew milk","almond flour","nut butter"]},
  {id:"soy",name:"Soy",g:"food",kw:["soya","soybean","soybeans","tofu","edamame","miso","tempeh","tamari","soy sauce","shoyu","soy lecithin","teriyaki","natto","soy milk"]},
  {id:"wheat",name:"Wheat / Gluten",g:"food",kw:["wheat","flour","bread","pasta","gluten","semolina","durum","spelt","couscous","bulgur","seitan","farina","noodle","noodles","linguine","spaghetti","tortilla","flour tortilla","cracker","crackers","cake","cookie","pastry","croissant","bagel","pizza","breadcrumbs","panko","croutons","barley","rye","malt","beer","pancake","waffle","bun","toast","muffin","granola","pretzel","dumpling","ramen","udon","tempura","sandwich","burger bun","bolognese","lasagna"],ex:["buckwheat","rice noodles","corn tortilla","rice paper"]},
  {id:"fish",name:"Fish",g:"food",kw:["salmon","tuna","cod","anchovy","anchovies","worcestershire","caesar dressing","fish sauce","nam pla","sardine","tilapia","halibut","trout","haddock","mackerel","sea bass","snapper","surimi","bonito","dashi","caviar","roe","pollock","catfish","swordfish"]},
  {id:"shellfish",name:"Shellfish",g:"food",kw:["shrimp","prawn","prawns","crab","lobster","crayfish","crawfish","langoustine","scallop","clam","clams","mussel","mussels","oyster","oysters","squid","calamari","octopus","scampi","krill","oyster sauce","shrimp paste","paella","cioppino","bouillabaisse","seafood"]},
  {id:"sesame",name:"Sesame",g:"food",kw:["tahini","hummus","halva","halvah","benne","gomasio","za'atar","zaatar","sesame oil","furikake","sesame seeds"]},
  {id:"mustard",name:"Mustard",g:"food",kw:["mustard seed","dijon","honey mustard"]},
  {id:"penicillin",name:"Penicillin",g:"med",kw:["amoxicillin","ampicillin","augmentin","dicloxacillin","piperacillin","penicillin vk","nafcillin","oxacillin"]},
  {id:"sulfa",name:"Sulfa drugs",g:"med",kw:["sulfamethoxazole","bactrim","septra","sulfasalazine","sulfonamide","sulfadiazine"]},
  {id:"nsaid",name:"NSAIDs",g:"med",kw:["ibuprofen","advil","motrin","naproxen","aleve","aspirin","diclofenac","celecoxib","meloxicam","ketorolac","nsaid"]},
  {id:"latex",name:"Latex",g:"env",kw:["rubber","balloon","balloons","latex gloves","rubber gloves"]},
  {id:"cat",name:"Cat dander",g:"env",kw:["cat","cats","kitten","kittens","feline","litter box"]},
  {id:"dog",name:"Dog dander",g:"env",kw:["dog","dogs","puppy","puppies","canine"],ex:["hot dog","corn dog","hot dogs","corn dogs"]},
  {id:"pollen",name:"Pollen",g:"env",kw:["grass","ragweed","birch","oak","mowing","hay","hayfever","tree pollen","flowers","pollen count"]},
  {id:"dust",name:"Dust mites",g:"env",kw:["dust","dusty","dusting","vacuuming","mites","bedding","carpet"]},
  {id:"mold",name:"Mold",g:"env",kw:["mould","mildew","basement","damp","musty"]},
  {id:"insect",name:"Insect stings",g:"env",kw:["bee","bees","wasp","hornet","yellow jacket","sting","stung","fire ant"]},
  {id:"nickel",name:"Nickel",g:"env",kw:["jewelry","jewellery","earring","earrings","belt buckle","watch band","costume jewelry"]},
  {id:"fragrance",name:"Fragrance",g:"env",kw:["perfume","parfum","cologne","scented","air freshener","candle"]},
  {id:"sulfite",name:"Sulfites",g:"food",kw:["sulfite","sulphite","metabisulfite","sulfur dioxide","wine","dried fruit","dried apricots"]}
];
const DICT_BY = Object.fromEntries(DICT.map(d=>[d.id,d]));
const CROSS = [
  {a:"pollen",kw:["apple","pear","cherry","peach","plum","carrot","celery","kiwi","banana","melon","tomato"],note:"Pollen–food syndrome: people with pollen allergy often react to some raw fruits and vegetables."},
  {a:"latex",kw:["banana","avocado","kiwi","chestnut","papaya"],note:"Latex–fruit syndrome: these foods share proteins with latex."},
  {a:"dust",kw:["shrimp","prawn","lobster","crab","crawfish"],note:"Dust-mite and shellfish proteins (tropomyosin) can cross-react."},
  {a:"shellfish",kw:["dust mites","cockroach"],note:"Shellfish and dust-mite proteins can cross-react."},
  {a:"peanut",kw:["lupin","lupine","lupini","pea protein"],note:"Lupin and pea are legumes that can cross-react with peanut."},
  {a:"penicillin",kw:["cephalexin","keflex","cefdinir","cefuroxime","ceftriaxone","cephalosporin"],note:"A small share of people with penicillin allergy also react to cephalosporins."},
  {a:"milk",kw:["goat milk","goat cheese","sheep milk","sheep cheese","manchego","pecorino"],note:"Goat and sheep milk proteins closely resemble cow's milk."},
  {a:"treenut",kw:["coconut"],note:"Coconut is rarely a problem for tree-nut allergy, but check with your allergist."},
  {a:"fish",kw:["fish oil","omega-3","gelatin"],note:"Fish-derived supplements or gelatin can carry fish protein."}
];
const TYPES = [
  {id:"food",label:"Food & drink",short:"Food",route:"ingest",icon:"food"},
  {id:"med",label:"Medication",short:"Medicine",route:"ingest",icon:"pill"},
  {id:"skin",label:"Skin contact",short:"Contact",route:"contact",icon:"drop"},
  {id:"env",label:"Environment",short:"Environ.",route:"inhale",icon:"wind"},
  {id:"other",label:"Other",short:"Other",route:"ingest",icon:"dots"}
];
const TYPE_BY = Object.fromEntries(TYPES.map(t=>[t.id,t]));
const SYMPTOMS = [
  {g:"Skin",items:["Hives","Itching","Rash","Flushing","Lip or face swelling","Eczema flare"]},
  {g:"Nose & eyes",items:["Sneezing","Runny or stuffy nose","Itchy, watery eyes"]},
  {g:"Breathing",items:["Throat tightness","Wheezing","Short of breath","Coughing","Hoarse voice","Tongue swelling"]},
  {g:"Stomach",items:["Tingling mouth","Nausea","Vomiting","Stomach cramps","Diarrhea"]},
  {g:"Whole body",items:["Dizziness","Fainting","Racing heart","Sense of doom","Headache","Fatigue"]}
];
const DANGER_SX = new Set(["Throat tightness","Wheezing","Short of breath","Hoarse voice","Tongue swelling","Fainting","Sense of doom"]);
const TREATMENTS = ["None","Antihistamine","Epinephrine","Inhaler","Steroid","Urgent care / ER"];
const DURATIONS = ["Under 30 min","30–60 min","1–3 hours","3–12 hours","12–24 hours","Over a day","Still going"];
const SEV = ["","Mild","Moderate","Severe","Anaphylactic"];
const RSEV = ["","Mild","Moderate","Severe","Life-threatening"];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s||"").toLowerCase().replace(/[’`]/g,"'").replace(/[^\p{L}\p{N}\s'&+-]/gu," ").replace(/\s+/g," ").trim()}
function cap(s){s=String(s||"");return s.charAt(0).toUpperCase()+s.slice(1)}
function uniq(a){return [...new Set(a.filter(Boolean))]}
const RE=new Map();
function kwRe(kw){let r=RE.get(kw);if(!r){const k=norm(kw).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");r=new RegExp("(?:^|[^\\p{L}\\p{N}])"+k+"(?:s|es)?(?=$|[^\\p{L}\\p{N}])","u");RE.set(kw,r)}return r}

function fromInput(v){const t=new Date(v).getTime();return isNaN(t)?Date.now():t}

function startOfDay(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
function fmtDay(ts){const t0=startOfDay(Date.now()),d=startOfDay(ts);if(d===t0)return "Today";if(d===t0-DAY)return "Yesterday";
  return new Date(ts).toLocaleDateString([], {weekday:"short",month:"short",day:"numeric",year:new Date(ts).getFullYear()!==new Date().getFullYear()?"numeric":undefined})}
function fmtWhen(ts){return fmtDay(ts)+", "+fmtTime(ts)}
function fmtGap(h){if(h<1/60)return "at the same time";const m=Math.round(h*60);if(m<60)return m+" min";const hh=Math.floor(m/60),mm=m%60;if(hh>=24){const d=Math.floor(hh/24),r=hh%24;return d+"d"+(r?" "+r+"h":"")}return hh+"h"+(mm?" "+mm+"m":"")}
function plural(n,w,p){return n+" "+(n===1?w:(p||w+"s"))}

/* ============================================================ detection */
let CATS=[], CATS_BY=new Map(), CAT_VER=-1;
function catId(a){return a.preset||("c-"+a.id)}
function categories(){
  if(CAT_VER===VER)return CATS;
  const out=[],used=new Set();
  for(const a of S.allergens){const p=a.preset&&DICT_BY[a.preset];const id=catId(a);used.add(id);
    out.push({id,name:a.name,kw:uniq([a.name,...(p?[p.name,...p.kw]:[]),...(a.keywords||[])]),ex:p&&p.ex||[],declared:a});}
  for(const d of DICT)if(!used.has(d.id))out.push({id:d.id,name:d.name,kw:uniq([d.name,...d.kw]),ex:d.ex||[],declared:null});
  CATS=out;CATS_BY=new Map(out.map(c=>[c.id,c]));CAT_VER=VER;COMP=new WeakMap();
  return out;
}
function detectText(t){
  const hits=[];
  for(const c of categories()){
    let tt=t; for(const x of c.ex)if(tt.includes(x))tt=tt.split(x).join(" ");
    for(const k of c.kw){if(kwRe(k).test(tt)){hits.push({cat:c,kw:k});break;}}
  }
  return hits;
}
function ingTokens(s){return uniq(String(s||"").split(/[,;\n/()]|\band\b|\bwith\b/).map(x=>norm(x).replace(/^\d+(\.\d+)?\s*(mg|g|ml|oz|cups?|tbsp|tsp)?\s*/,"")).filter(x=>x.length>=2&&x.length<=40&&!STOP.has(x)))}
let COMP=new WeakMap(); const LABEL=new Map();
function comps(e){
  categories();
  let c=COMP.get(e); if(c)return c;
  const set=new Set();
  const text=norm((e.name||"")+" , "+(e.ingredients||""));
  for(const h of detectText(text)){set.add("a:"+h.cat.id);LABEL.set("a:"+h.cat.id,h.cat.name)}
  for(const m of (e.manual||[])){if(CATS_BY.has(m)){set.add("a:"+m);LABEL.set("a:"+m,CATS_BY.get(m).name)}}
  const nk=norm(e.name); if(nk){set.add("i:"+nk); if(!LABEL.has("i:"+nk))LABEL.set("i:"+nk,(e.name||"").trim())}
  for(const tok of ingTokens(e.ingredients)){ if(tok===nk)continue; if(detectText(tok).length)continue; set.add("g:"+tok); if(!LABEL.has("g:"+tok))LABEL.set("g:"+tok,cap(tok)) }
  c=[...set]; COMP.set(e,c); return c;
}
function label(k){return LABEL.get(k)||cap(k.slice(2))}
function kindName(k){return k[0]==="a"?"Allergen group":k[0]==="i"?"Item":"Ingredient"}
function declaredOf(k){if(k[0]!=="a")return null;categories();const c=CATS_BY.get(k.slice(2));return c&&c.declared}

/* ============================================================ analysis */
function timeW(h,route){
  if(h<0)return 0;
  if(route==="contact")return h<=1?1:h<=12?.75:h<=72?.6:.2;
  if(route==="inhale")return h<=1?1:h<=4?.7:h<=12?.45:h<=24?.3:.15;
  return h<=2?1:h<=6?.75:h<=12?.5:h<=24?.35:h<=48?.2:.1;
}
let AN=null, AN_VER=-1;
function analyze(){
  if(AN&&AN_VER===VER)return AN;
  categories();
  const W=(S.settings.win||24)*HOUR;
  const ex=[...S.exposures].sort((a,b)=>a.t-b.t), rx=[...S.reactions].sort((a,b)=>a.t-b.t);
  const stats=new Map(); const st=k=>{let s=stats.get(k);if(!s){s={m:0,mr:0,k:new Set(),confirmed:0,gaps:[]};stats.set(k,s)}return s};
  let followedAll=0;
  for(const e of ex){
    const followed=rx.some(r=>r.t>=e.t&&r.t-e.t<=W); if(followed)followedAll++;
    for(const c of comps(e)){const s=st(c);s.m++;if(followed)s.mr++}
  }
  for(const r of rx){
    const seen=new Set();
    for(const e of ex){ if(e.t<=r.t&&r.t-e.t<=W){ for(const c of comps(e)){ const s=st(c); if(!seen.has(c)){s.k.add(r.id);s.gaps.push((r.t-e.t)/HOUR);seen.add(c)} } } }
    if(r.confirmed){st(r.confirmed).confirmed++}
  }
  AN={W,stats,n:rx.length,nx:ex.length,base:ex.length?followedAll/ex.length:0};AN_VER=VER;return AN;
}
function strengthOf(k,s,A){
  const rr=(s.mr+1)/(s.m+2), cover=A.n?s.k.size/A.n:0;
  let v=Math.sqrt(cover*rr)*100; if(s.confirmed)v*=1+.35*s.confirmed; return Math.min(99,Math.round(v));
}
function rca(r){
  const A=analyze(), W=A.W;
  const win=S.exposures.filter(e=>e.t<=r.t&&r.t-e.t<=W).sort((a,b)=>b.t-a.t);
  const cand=new Map();
  for(const e of win){const gap=(r.t-e.t)/HOUR,f=timeW(gap,TYPE_BY[e.type]?TYPE_BY[e.type].route:"ingest");
    for(const c of comps(e)){let x=cand.get(c);if(!x){x={key:c,T:0,exps:[]};cand.set(c,x)}x.exps.push({e,gap});if(f>x.T)x.T=f}}
  const list=[...cand.values()].map(x=>{
    const s=A.stats.get(x.key)||{m:1,mr:1,k:new Set([r.id]),confirmed:0};
    const kind=x.key[0], decl=declaredOf(x.key);
    const K=decl?1.5+.3*decl.severity:1, tw=kind==="a"?1:kind==="i"?.7:.5;
    const rr=(s.mr+1)/(s.m+2), cover=A.n?s.k.size/A.n:1;
    const conf=s.confirmed?1+.7*s.confirmed:1;
    const raw=x.T*K*tw*(.3+rr)*(.5+cover)*conf;
    return Object.assign(x,{s,kind,decl,rr,cover,raw});
  }).sort((a,b)=>b.raw-a.raw);
  const sum=list.reduce((a,b)=>a+b.raw,0)||1;
  list.forEach(x=>{x.pct=Math.max(1,Math.round(100*x.raw/sum))});
  return {win,list,A};
}
function evidence(x,r,A){
  const out=[]; const best=x.exps.reduce((a,b)=>a.gap<b.gap?a:b);
  const route=TYPE_BY[best.e.type]?TYPE_BY[best.e.type].route:"ingest";
  const verb=route==="contact"?"Contact":route==="inhale"?"Exposure":"Consumed";
  out.push({t:verb+" "+(best.gap<1/60?"right as":fmtGap(best.gap)+" before")+" symptoms began"+(x.kind!=="i"?" in “"+best.e.name+"”":""),c:best.gap<=2?"pos":""});
  if(x.decl)out.push({t:"On your allergen list · "+SEV[x.decl.severity],c:"pos"});
  const others=x.s.k.size-(x.s.k.has(r.id)?1:0);
  if(A.n>1)out.push({t:others>0?"Also came before "+plural(others,"other reaction"):"Not present before any of your other reactions",c:others>0?"pos":"neg"});
  const safe=x.s.m-x.s.mr;
  if(x.s.m>1)out.push({t:plural(x.s.m,"exposure")+" logged · "+(safe>0?plural(safe,"time")+" with no reaction":"every one followed by a reaction"),c:safe>0?"neg":"pos"});
  if(x.s.confirmed)out.push({t:"You confirmed it as the cause of "+plural(x.s.confirmed,"reaction"),c:"pos"});
  return out;
}

function sevChip(sev,txt){return '<span class="chip s'+sev+'">'+esc(txt)+"</span>"}
function expHits(e){categories();return comps(e).filter(k=>k[0]==="a").map(k=>({k,d:declaredOf(k)}))}
function expRow(e){
  const t=TYPE_BY[e.type]||TYPE_BY.other; const hits=expHits(e); const decl=hits.filter(h=>h.d).sort((a,b)=>b.d.severity-a.d.severity);
  const top=decl[0]; const ic=top?(top.d.severity>=3?"hit3":"hit"):"";
  const chips=decl.map(h=>sevChip(h.d.severity,label(h.k))).join("")+hits.filter(h=>!h.d).slice(0,3).map(h=>'<span class="chip">'+esc(label(h.k))+"</span>").join("");
  return '<button class="row" data-act="openExp" data-id="'+e.id+'"><span class="tm">'+fmtTime(e.t)+'</span><span class="ic '+ic+'">'+icon(top?"alert":t.icon)+'</span><span class="main"><b>'+esc(e.name)+"</b>"+
    (e.ingredients?'<span class="sub">'+esc(e.ingredients)+"</span>":"")+(chips?'<span class="chips">'+chips+"</span>":"")+'</span><span class="chev">'+icon("chev","sm")+"</span></button>";
}
function rxRow(r){
  const c=r.confirmed?label(r.confirmed):(()=>{const R=rca(r);return R.list[0]?label(R.list[0].key):null})();
  return '<button class="row" data-act="openRx" data-id="'+r.id+'"><span class="tm">'+fmtTime(r.t)+'</span><span class="ic rx">'+icon("bolt")+'</span><span class="main"><b>Reaction · '+RSEV[r.severity]+'</b><span class="sub">'+esc(r.symptoms.join(", ")||"No symptoms recorded")+'</span><span class="chips">'+sevChip(r.severity,RSEV[r.severity])+(c?'<span class="chip acc">'+(r.confirmed?"Cause: ":"Likely: ")+esc(c)+"</span>":"")+'</span></span><span class="chev">'+icon("chev","sm")+"</span></button>";
}

function viewToday(){
  const now=Date.now(); const last=[...S.reactions].sort((a,b)=>b.t-a.t)[0];
  const free=last?Math.floor((startOfDay(now)-startOfDay(last.t))/DAY):null;
  const todayEx=S.exposures.filter(e=>e.t>=startOfDay(now));
  const weekAlerts=S.exposures.filter(e=>e.t>=now-7*DAY&&expHits(e).some(h=>h.d)).length;
  const weekRx=S.reactions.filter(r=>r.t>=now-7*DAY).length;
  const items=[...todayEx.map(e=>({t:e.t,h:expRow(e)})),...S.reactions.filter(r=>r.t>=startOfDay(now)).map(r=>({t:r.t,h:rxRow(r)}))].sort((a,b)=>b.t-a.t);
  const A=analyze(); const trig=topTriggers(A).filter(t=>t.str>=40)[0];
  const sug=suggestions(A)[0];
  const d=new Date();
  let h='<div class="eyebrow">'+d.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"})+'</div><h1 class="title">Today</h1>'+demoBanner();
  h+=installCard();

function logList(){
  const q=norm(LOGQ);
  let items=[];
  if(LOGFILTER!=="rx")for(const e of S.exposures){if(LOGFILTER==="hit"&&!expHits(e).some(h=>h.d))continue;if(q&&!norm(e.name+" "+e.ingredients+" "+e.where+" "+e.notes).includes(q))continue;items.push({t:e.t,h:expRow(e)})}
  if(LOGFILTER==="all"||LOGFILTER==="rx")for(const r of S.reactions){if(q&&!norm(r.symptoms.join(" ")+" "+r.notes+" "+RSEV[r.severity]).includes(q))continue;items.push({t:r.t,h:rxRow(r)})}

  let h="",day=null;
  for(const it of items){const d=fmtDay(it.t);if(d!==day){if(day!==null)h+="</div>";h+='<div class="dayhead">'+esc(d)+'</div><div class="list">';day=d}h+=it.h}
  return h+"</div>";
}
function topTriggers(A){
  const out=[];
  for(const [k,s] of A.stats){
    if(!s.k.size)continue; if(k[0]!=="a"&&(s.k.size<2||s.mr/s.m<.4))continue;
    const g=s.gaps.slice().sort((a,b)=>a-b); const onset=g.length?g[Math.floor(g.length/2)]:null;
    out.push({k,s,str:strengthOf(k,s,A),decl:declaredOf(k),onset});
  }
  return out.sort((a,b)=>b.str-a.str);
}
function suggestions(A){return topTriggers(A).filter(t=>!t.decl&&t.s.k.size>=2&&t.str>=45&&(t.s.mr/t.s.m)>=.5)}

}

function weekChart(){
  const weeks=8, now=Date.now(), w0=startOfDay(now)-((new Date().getDay()+6)%7)*DAY; // monday
  const bins=[];for(let i=weeks-1;i>=0;i--){const s=w0-i*7*DAY;bins.push({s,e:s+7*DAY,c:0,max:0})}
  for(const r of S.reactions)for(const b of bins)if(r.t>=b.s&&r.t<b.e){b.c++;b.max=Math.max(b.max,r.severity)}
  const mx=Math.max(2,...bins.map(b=>b.c)); const W=320,H=130,pl=22,pb=22,bw=(W-pl)/weeks;
  let s='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Reactions per week, last 8 weeks">';
  for(let g=0;g<=mx;g++){const y=H-pb-(H-pb-10)*g/mx; s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>'+(g%Math.ceil(mx/3)===0||g===mx?'<text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+g+"</text>":"")}
  bins.forEach((b,i)=>{const x=pl+i*bw+bw*.3,w=bw*.4,h=(H-pb-10)*b.c/mx,y=H-pb-h;
    if(b.c)s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2" fill="var(--sev'+b.max+')"/><text x="'+(x+w/2)+'" y="'+(y-4)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+b.c+"</text>";
    const d=new Date(b.s);s+='<text x="'+(x+w/2)+'" y="'+(H-6)+'" text-anchor="middle">'+(d.getMonth()+1)+"/"+d.getDate()+"</text>"});
  return s+'</svg><div class="chips" style="padding:8px 10px 0">'+[1,2,3,4].map(i=>'<span class="chip"><span class="dot" style="background:var(--sev'+i+')"></span>'+RSEV[i]+"</span>").join("")+"</div>";
}

function expWarnings(name,ing,manual){
  categories();
  const t=norm(name+" , "+ing); const hits=detectText(t); const ids=new Set(hits.map(h=>h.cat.id));
  for(const m of manual)if(!ids.has(m)&&CATS_BY.has(m)){hits.push({cat:CATS_BY.get(m),kw:null});ids.add(m)}
  const declared=hits.filter(h=>h.cat.declared).sort((a,b)=>b.cat.declared.severity-a.cat.declared.severity);
  const other=hits.filter(h=>!h.cat.declared);
  const cross=[];for(const x of CROSS){const c=CATS_BY.get(x.a);if(!c||!c.declared||ids.has(x.a))continue;const kw=x.kw.find(k=>kwRe(k).test(t));if(kw)cross.push({cat:c,kw,note:x.note})}
  const A=analyze(); const hist=[];
  if(norm(name)||ing.trim()){
    for(const k of comps({name,ingredients:ing,manual})){const s=A.stats.get(k);if(!s||!s.k.size||declaredOf(k))continue;if(k[0]==="g"&&s.k.size<2)continue;hist.push({k,s})}
    hist.sort((a,b)=>b.s.k.size-a.s.k.size);
  }
  return {declared,other,cross,hist,empty:!t};
}

/* ---- report / backup ---- */
function reportText(){
  const A=analyze(); const L=[];
  L.push("ALLERGY LOG SUMMARY · "+new Date().toLocaleDateString());
  const first=Math.min(...S.exposures.map(e=>e.t),...S.reactions.map(r=>r.t));
  if(isFinite(first))L.push("Period: "+new Date(first).toLocaleDateString()+" – "+new Date().toLocaleDateString()+" · "+S.exposures.length+" exposures, "+S.reactions.length+" reactions");
  L.push("","KNOWN ALLERGENS");
  if(!S.allergens.length)L.push("  None recorded");
  for(const a of [...S.allergens].sort((x,y)=>y.severity-x.severity))L.push("  • "+a.name+" ("+SEV[a.severity]+")"+(a.notes?" – "+a.notes:""));
  L.push("","REACTIONS");
  for(const r of [...S.reactions].sort((a,b)=>b.t-a.t)){const R=rca(r);const c=r.confirmed?label(r.confirmed)+" (confirmed)":R.list[0]?label(R.list[0].key)+" ("+R.list[0].pct+"% likely)":"unknown";
    L.push("  • "+fmtWhen(r.t)+" – "+RSEV[r.severity]+": "+r.symptoms.join(", "));
    L.push("    Treatment: "+(r.treatments.join(", ")||"none")+(r.duration?" · Lasted "+r.duration:""));
    L.push("    Likely cause: "+c);
    const pre=R.win.slice(0,4).map(e=>e.name+" ("+fmtGap((r.t-e.t)/HOUR)+" before)");if(pre.length)L.push("    Preceded by: "+pre.join("; "));}
  const t=topTriggers(A).slice(0,6);
  if(t.length){L.push("","SUSPECTED TRIGGERS (pattern score 0–100)");for(const x of t)L.push("  • "+label(x.k)+": "+x.str+" – before "+x.s.k.size+"/"+A.n+" reactions; "+x.s.mr+"/"+x.s.m+" exposures followed by a reaction"+(x.decl?" [known allergen]":""))}
  const sug=suggestions(A);if(sug.length){L.push("","TO DISCUSS");for(const s of sug)L.push("  • Possible sensitivity to "+label(s.k)+" (not on known list)")}
  L.push("","Generated by Allergen Tracker. Patterns are not a diagnosis.");
  return L.join("\n");
}

  delRx:t=>{if(t.dataset.arm!=="1"){t.dataset.arm="1";t.innerHTML=icon("trash")+" Tap again to delete";return}const id=$("#sheetBody").dataset.editId;S.reactions=S.reactions.filter(x=>x.id!==id);bump();removeDoc("r-"+id);closeSheet();render();toast("Deleted")},
  confirm:t=>{const r=findRx(t.dataset.id);if(!r)return;r.confirmed=t.dataset.k;bump();persistRx(r);render();sheetRxDetail(r);toast("Cause confirmed: "+label(t.dataset.k))},
  unconfirm:t=>{const r=findRx(t.dataset.id);if(!r)return;r.confirmed=null;bump();persistRx(r);render();sheetRxDetail(r)},
  addAllergen:()=>sheetAllergenPicker(),
  customAllergen:()=>sheetAllergenForm(null,null),
  preset:t=>{const ex=S.allergens.find(a=>a.preset===t.dataset.v);sheetAllergenForm(ex||null,ex?null:t.dataset.v)},
  editAllergen:t=>{const a=S.allergens.find(x=>x.id===t.dataset.id);if(a)sheetAllergenForm(a)},
  saveAllergen:()=>saveAllergen(),
  delAllergen:t=>{if(t.dataset.arm!=="1"){t.dataset.arm="1";t.innerHTML=icon("trash")+" Tap again to remove";return}const id=$("#sheetBody").dataset.aid;S.allergens=S.allergens.filter(a=>a.id!==id);bump();persistProfile();closeSheet();render();toast("Removed")},
  addSuggested:t=>{const k=t.dataset.k;if(k[0]==="a"&&DICT_BY[k.slice(2)])sheetAllergenForm(null,k.slice(2));else{sheetAllergenForm(null,null);$("#aName").value=label(k)}},
  dismissInstall:()=>{try{localStorage.setItem(KEY+".installDismissed","1")}catch(_){}render()},
  win:t=>{S.settings.win=+t.dataset.v;bump();persistProfile();render()},
  theme:t=>{S.settings.theme=t.dataset.v;applyTheme();if(S.demo){try{localStorage.setItem(KEY+".theme",t.dataset.v)}catch(_){}}else persistProfile();render();toast(t.dataset.v==="system"?"Matching your system appearance":(t.dataset.v==="dark"?"Dark":"Light")+" mode on")},
  logf:t=>{LOGFILTER=t.dataset.v;render()},
  report:()=>sheetText("Allergist summary",reportText(),"Copy this into an email or your patient portal message."),
  export:()=>sheetText("Backup",JSON.stringify({app:"allergen-tracker",v:1,exported:new Date().toISOString(),allergens:S.allergens,exposures:S.exposures,reactions:S.reactions,settings:S.settings}),"Copy and keep this somewhere safe, like Notes. Restore it from this tab any time."),
  import:()=>sheetImport(),
  doImport:()=>{let j;try{j=JSON.parse($("#impTxt").value)}catch(_){toast("That doesn’t look like a backup",true);return}
    if(!j||!Array.isArray(j.exposures)||!Array.isArray(j.reactions)){toast("That doesn’t look like a backup",true);return}
    const old=S.demo?null:{x:S.exposures.map(e=>e.id),r:S.reactions.map(r=>r.id)};
    S.demo=false;S.allergens=j.allergens||[];S.exposures=j.exposures;S.reactions=j.reactions;S.settings=Object.assign({win:24},j.settings||{});bump();
    if(old){old.x.forEach(id=>{if(!S.exposures.some(e=>e.id===id))removeDoc("x-"+id)});old.r.forEach(id=>{if(!S.reactions.some(r=>r.id===id))removeDoc("r-"+id)})}
    persistProfile();S.exposures.forEach(persistExp);S.reactions.forEach(persistRx);closeSheet();render();toast("Backup restored")},
  copyText:async()=>{const t=$("#txt").textContent;try{await navigator.clipboard.writeText(t);toast("Copied")}catch(_){const r=document.createRange();r.selectNodeContents($("#txt"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Tap Copy in the menu")}},
  startOwn:()=>{S.demo=false;S.allergens=[];S.exposures=[];S.reactions=[];S.settings={win:24,theme:S.settings.theme};bump();persistProfile();TAB="today";render();sheetAllergenPicker();toast("Fresh start. Add your allergens first")},
  wipe:t=>{if(!wipeArm){wipeArm=true;t.querySelector("span").textContent="Tap again to delete everything";setTimeout(()=>{wipeArm=false},4000);return}
    wipeArm=false;S.exposures.forEach(e=>removeDoc("x-"+e.id));S.reactions.forEach(r=>removeDoc("r-"+r.id));S.allergens=[];S.exposures=[];S.reactions=[];bump();persistProfile();render();toast("All data deleted")}
};
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-act]");if(!t)return;const f=ACT[t.dataset.act];if(f){ev.preventDefault();f(t,ev)}});

/* drag-to-dismiss */
(function(){let y0=null,dy=0;const g=$("#grab"),sh=$("#sheet");
  g.addEventListener("pointerdown",e=>{y0=e.clientY;dy=0;sh.style.transition="none";g.setPointerCapture(e.pointerId)});
  g.addEventListener("pointermove",e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform="translateY("+dy+"px)"});
  const end=()=>{if(y0==null)return;sh.style.transition="";y0=null;if(dy>110)closeSheet();else sh.style.transform=""};
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
})();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").classList.contains("open"))closeSheet()});
window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","");if(["today","log","insights","allergens"].includes(h)&&h!==TAB){TAB=h;render()}});

/* ============================================================ boot & sync */
function applyTheme(){const t=S.settings.theme||"system";const r=document.documentElement;if(t==="system")r.removeAttribute("data-appearance");else r.setAttribute("data-appearance",t);try{localStorage.setItem(KEY+".theme",t)}catch(_){}}
function applyData(d){const keep=S.settings.theme;S.allergens=d.allergens||[];S.exposures=d.exposures||[];S.reactions=d.reactions||[];S.settings=Object.assign({win:24},d.settings||{});if(!S.settings.theme&&keep)S.settings.theme=keep;bump();applyTheme()}
(function(){try{const t=localStorage.getItem(KEY+".theme");if(t&&t!=="system"){S.settings.theme=t;document.documentElement.setAttribute("data-appearance",t)}}catch(_){}})();
(function boot(){
  const L=loadLocal();
  if(L&&L.started){applyData(L);S.demo=false}else{applyData(sampleData());S.demo=true}
  render();
  const L2=document.getElementById("launch");setTimeout(()=>L2.classList.add("gone"),IS_STANDALONE?1500:600);
  if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
async function connect(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    const user=await window.claude.use("user"); const id=user?await user.id():null;
    const db=await window.claude.use("db"); if(!db||!id)return;
    col=db.collection("data/users/"+id);
    let first=true;
    col.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      if(snap.empty){
        if(first&&!(snap.metadata&&snap.metadata.fromCache)){first=false;syncState="cloud";
          if(!S.demo){persistProfile();S.exposures.forEach(persistExp);S.reactions.forEach(persistRx)}
          if(TAB==="allergens"&&!$("#sheet").classList.contains("open"))render();}
        return;
      }
      first=false;syncState="cloud";
      const d={allergens:[],exposures:[],reactions:[],settings:{win:24}};let started=false;
      for(const doc of snap.docs){const v=doc.data();if(!v)continue;
        if(doc.id==="profile"){d.allergens=v.allergens||[];d.settings=v.settings||d.settings;started=!!v.started}
        else if(doc.id.startsWith("x-"))d.exposures.push(v);else if(doc.id.startsWith("r-"))d.reactions.push(v)}
      if(!started&&!d.exposures.length&&!d.reactions.length)return;
      S.demo=false;applyData(d);saveLocal();
      if(!$("#sheet").classList.contains("open"))render();
    },()=>{});
  }catch(_){}
}
</script>
